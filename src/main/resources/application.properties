spring.application.name=ecommercebackend
# 1. URL de conexión a la base de datos (El puerto 5432 es el que expusimos en Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce

# 2. Credenciales (Las mismas que en el docker-compose.yml)
spring.datasource.username=admin
spring.datasource.password=admin

# 3. Hibernate (el ORM) que actualice automáticamente el esquema de la BD por ahora
spring.jpa.hibernate.ddl-auto=update